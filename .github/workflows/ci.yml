name: Kurox CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: apps/api
        run: ruff check app tests
      - name: Pytest (no database)
        working-directory: apps/api
        run: pytest tests/test_health.py tests/test_auth.py tests/test_money.py -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @kurox/web typecheck
