services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kurox
      POSTGRES_PASSWORD: kurox
      POSTGRES_DB: kurox
    ports:
      - "5432:5432"
    volumes:
      - kurox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kurox
      MINIO_ROOT_PASSWORD: kurox-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kurox_minio:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  kurox_pg:
  kurox_minio:
